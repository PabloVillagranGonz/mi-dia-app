<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Mi Día</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mi Día" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body { height: 100%; background-color: #111216; }
      body { margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      /* Ocupa toda la pantalla y deja libres el notch / isla dinámica y el indicador de inicio */
      #root {
        display: flex; position: fixed; inset: 0; box-sizing: border-box; background-color: #111216;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* Sin barras de scroll visibles (como en la app nativa) */
      * { scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; }
      /* Sin selección de texto ni menú al mantener pulsado, salvo en campos */
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      /* Campo de hora: texto centrado, sin el icono de reloj ni el estilo de Safari */
      input[type="time"] { -webkit-appearance: none; appearance: none; display: flex; align-items: center; justify-content: center; }
      input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
      input[type="time"]::-webkit-date-and-time-value { text-align: center; }
      input[type="time"]::-webkit-datetime-edit { display: flex; justify-content: center; padding: 0; }
    </style>
  </head>
  <body>
    <noscript>Activa JavaScript para usar Mi Día.</noscript>
    <div id="root"></div>
    <script>
      // App añadida a la pantalla de inicio (iOS): con la barra de estado translúcida, Safari calcula
      // la ventana más corta y lo fijado abajo deja un hueco. Ahí la app ocupa la pantalla entera,
      // así que se usa directamente su alto. En el navegador normal no se toca.
      (function () {
        var standalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        var root = document.getElementById('root');
        function fit() {
          var h = Math.max(window.screen.height, window.screen.width);
          var w = Math.min(window.screen.height, window.screen.width);
          root.style.bottom = 'auto';
          root.style.height = (window.innerWidth > window.innerHeight ? w : h) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
      })();
    </script>
  </body>
</html>
